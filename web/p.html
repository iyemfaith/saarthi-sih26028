<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>SAARTHI Passenger</title>
<meta name="description" content="When should I leave? A calibrated arrival window and a clear decision, in your language.">
<style>
:root { --ink:#0b0b0b; --ink2:#46453f; --muted:#7d7b74; --page:#f6f5f1; --card:#fff; --line:#e3e2db; --accent:#1f63b8; --wash:#e8f0fb;
  --good:#0a7d0a; --warn:#9a6700; --warnbg:#fff4d6; --crit:#b42525; --critbg:#fdeaea; --night:#3b3486; --nightbg:#ecebfa;
  --f:system-ui,-apple-system,"Segoe UI","Nirmala UI","Noto Sans Devanagari",sans-serif; --base:17px; }
body.big { --base:20px; }
body.embed .bar { padding-top: 40px; }
*{box-sizing:border-box} html,body{margin:0;background:var(--page);color:var(--ink);font:var(--base)/1.45 var(--f)}
button{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.bar .logo{font-weight:800;letter-spacing:.05em;font-size:15px}.bar .logo span{font-weight:600;opacity:.8;margin-left:4px}
.bar .sp{flex:1}
.pill{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:2px}
.pill button{border:0;background:none;color:#fff;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:600;min-width:34px}
.pill button.on{background:#fff;color:var(--ink)}
.wrap{padding:14px 14px 90px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card+.card{margin-top:12px}
.tr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tr .no{font-size:1.25em;font-weight:800}.tr .nm{font-size:1.05em;font-weight:650}
.to{color:var(--ink2);font-size:.92em;margin-top:2px}
.dec{border-radius:16px;padding:18px 16px;margin-top:12px;display:flex;gap:14px;align-items:center}
.dec .ic{font-size:40px;line-height:1;flex:0 0 auto}
.dec .big{font-size:1.65em;font-weight:800;line-height:1.15}
.dec .small{font-size:.95em;margin-top:4px;font-weight:550}
.st-wait{background:var(--wash);color:#123e73}.st-get_ready{background:var(--warnbg);color:#5e4100}
.st-leave_now{background:var(--ink);color:#fff}.st-rest{background:var(--nightbg);color:var(--night)}
.st-too_late{background:var(--critbg);color:var(--crit)}.st-arrived{background:#eeede8;color:var(--ink2)}
.win{margin-top:16px}
.win .lab{color:var(--muted);font-size:.85em;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.win .w{font-size:1.5em;font-weight:800;margin-top:2px}
.win .odds{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--ink2);font-size:.95em}
.dots{display:inline-flex;gap:3px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent)}.dots i.o{background:#cfd9e8}
.line{margin-top:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:14px;min-height:64px;font-weight:700;font-size:.85em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 4px}
.acts button span{font-size:22px}
.acts button:active{background:var(--wash)}
h2{font-size:1em;margin:0 0 8px}
.why li{margin:6px 0}.why{padding-left:20px;margin:0}
.promise{display:flex;gap:10px;align-items:flex-start;font-size:.92em;color:var(--ink2)}
.promise b{color:var(--ink)}
.tog{width:100%;border:0;background:none;color:var(--accent);font-weight:700;padding:10px 0 0;text-align:left;cursor:pointer;font-size:.95em}
.jr{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:.92em}
.jr b{font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9em;max-width:92%;display:none;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.setup label{display:block;font-weight:700;margin:14px 0 6px}
.setup select,.setup input{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;background:#fff}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:72px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.choice button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:650;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.go{width:100%;height:58px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:1.05em;margin-top:18px;cursor:pointer}
.change{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:.9em}
svg text{font-family:var(--f)}
</style>
</head>
<body>
<div class="bar"><div class="logo">SAARTHI<span>सारथी</span></div><div class="sp"></div>
  <div class="pill" id="lang"><button data-v="en">EN</button><button data-v="hi">हिं</button><button data-v="hing">Hin</button></div>
  <div class="pill"><button id="size" title="Bigger text">A+</button></div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="/static/js/p.js?v=11"></script>
</body>
</html>
